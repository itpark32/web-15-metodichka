site_name: Методичка 15 потока
site_description: Короткий маршрут повторения веб-разработки по материалам 15 потока
site_url: https://itpark32.github.io/web-15-metodichka/
repo_name: itpark32/web-15-metodichka
repo_url: https://github.com/itpark32/web-15-metodichka

theme:
  name: material
  language: ru
  font: false
  icon:
    logo: material/web
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Включить темную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Включить светлую тему
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - toc.follow

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Маршрут: index.md
  - HTML и CSS:
      - Структура HTML: html.md
      - Кнопки и формы: buttons-forms.md
      - CSS и блочная модель: css.md
      - Flexbox и Grid: layout.md
      - Адаптивная верстка: responsive.md
      - БЭМ и SCSS: bem-scss.md
  - Инструменты:
      - Git и GitHub: git.md
      - Webpack и качество кода: tooling.md
  - JavaScript:
      - Данные и условия: js-basics.md
      - Циклы и алгоритмы: loops-algorithms.md
      - Коллекции: collections.md
      - Строки: strings.md
      - Массивы: arrays.md
      - Объекты: objects.md
      - Функции и область видимости: functions.md
      - Регулярные выражения: regex.md
      - DOM: dom.md
      - События и формы: events-forms.md
      - Асинхронность и Fetch API: async-api.md
  - Практика:
      - Проекты потока: projects.md
      - Мини-задачи: practice.md
  - Собеседование:
      - Как готовиться: interview/index.md
      - HTML и CSS: interview/html-css.md
      - JavaScript и браузер: interview/javascript.md
      - Пробное интервью: interview/mock.md
  - Дальше по программе: next.md
